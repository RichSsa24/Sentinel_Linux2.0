id: account-creation
title: Local account creation
description: >-
  Invocation of useradd/adduser/newusers. Creating a local account can be
  legitimate administration or an attacker establishing persistence.
severity: 5
attack: [T1136.001]
nist_csf: [DE.CM]
d3fend: [D3-PSA]
references:
  - https://attack.mitre.org/techniques/T1136/001/
condition:
  # Guard on the start event: the stop event carries the same command line
  # and would otherwise alert a second time for the same process.
  all:
    - {field: event.action, op: equals, value: process_started}
    - field: process.command_line
      op: regex
      value: '\b(?:useradd|adduser|newusers)\b'

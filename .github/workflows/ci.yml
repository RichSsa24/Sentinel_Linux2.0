# Sentinel-Linux 2.0 — CI pipeline.
#
# Gates (all must pass):
#   quality    ruff lint + format, mypy --strict, bandit, pip-audit, pytest with
#              a coverage floor — on Python 3.12 and 3.13. Publishes coverage
#              and a CycloneDX SBOM of the runtime dependencies.
#   precommit  every pre-commit hook (hygiene, ruff, bandit, detect-secrets).
#   container  builds the production image, smoke-tests it under the same
#              hardening as the Compose stack, and scans it with Trivy.
#   alerting   validates and unit-tests the Prometheus alert rules (promtool)
#              with the Prometheus image the Compose stack runs.
#   postgres   the PostgreSQL integration tests (migrations, timestamptz,
#              rejected rows, retention) against the database production uses.
#
# Supply chain:
# - `permissions: contents: read` everywhere; no job can write to the repo.
# - Every third-party action is pinned to a full commit SHA (version in the
#   trailing comment; Dependabot keeps them current). Tags are mutable — in
#   March 2026 the trivy-action tags were force-pushed to malicious commits.
# - Dependencies install from the hash-verified lockfile (`uv sync --frozen`).

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"  # the same uv as the image build
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (frozen, hash-verified)
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Ruff — lint
        run: uv run ruff check --output-format=github .

      - name: Ruff — format check
        run: uv run ruff format --check .

      - name: Mypy — strict types
        run: uv run mypy

      - name: Bandit — security lint
        run: uv run bandit -r src/ -c pyproject.toml

      - name: pip-audit — known-vulnerable dependencies
        run: |
          # `--quiet` silences the resolver status line that newer `uv` prints
          # to stdout; without it the file gets a leading non-requirement line
          # that pip-audit's strict mode rejects. The export keeps its hashes,
          # so pip-audit audits the pinned set as-is (`--disable-pip`) instead
          # of installing an unpinned pip into a temporary venv to resolve it.
          uv export --quiet --format requirements-txt --no-emit-project \
            -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --strict --disable-pip

      - name: Pytest — coverage (floor in pyproject.toml)
        run: |
          uv run pytest \
            --cov=src/sentinel \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml

      - name: SBOM — runtime dependencies (CycloneDX)
        if: matrix.python-version == '3.12'
        run: |
          uv export --quiet --format requirements-txt --no-emit-project --no-dev \
            -o requirements-runtime.txt
          uv run pip-audit -r requirements-runtime.txt --strict --disable-pip \
            --format cyclonedx-json -o sbom.cdx.json

      - name: Upload coverage and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14

  precommit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"  # the same uv as the image build
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Run pre-commit (all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  container:
    name: container image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f deploy/docker/Dockerfile -t sentinel-linux:ci .

      - name: Smoke test (read-only, no capabilities, host under /host)
        run: scripts/smoke_test_image.sh sentinel-linux:ci

      - name: Trivy — fixable HIGH/CRITICAL vulnerabilities fail the build
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinel-linux:ci
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  alerting:
    name: alert rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: promtool — validate and unit-test deploy/prometheus/alerts.yml
        run: |
          promtool() {
            docker run --rm --entrypoint promtool -w /rules \
              -v "$PWD/deploy/prometheus:/rules:ro" \
              prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
              "$@"
          }
          promtool check rules alerts.yml
          promtool test rules alerts.test.yml

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway  # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # The tests run as Sentinel's least-privilege role, created below by the
      # same script Compose runs: migrations and writes must work without a
      # superuser.
      SENTINEL_TEST_POSTGRES_URL: postgresql+asyncpg://sentinel:ci-app-throwaway@127.0.0.1:5432/sentinel  # pragma: allowlist secret
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"  # the same uv as the image build
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Create Sentinel's role (deploy/postgres/initdb)
        env:
          SERVICE: ${{ job.services.postgres.id }}
          POSTGRES_APP_PASSWORD: ci-app-throwaway  # pragma: allowlist secret
        run: >-
          docker exec -i -e POSTGRES_USER=postgres -e POSTGRES_APP_PASSWORD "$SERVICE"
          sh < deploy/postgres/initdb/10-sentinel-role.sh

      - name: Pytest — PostgreSQL integration (a skip fails the job)
        run: |
          set -o pipefail
          uv run pytest tests/test_postgres.py -rs | tee pytest.log
          if grep -q SKIPPED pytest.log; then
            echo "::error::the PostgreSQL tests were skipped"
            exit 1
          fi

# Sentinel-Linux 2.0 — CI pipeline.
#
# Gates (all must pass):
#   quality    ruff lint + format, mypy --strict, bandit, pip-audit, pytest with
#              a coverage floor — on Python 3.12 and 3.13. Publishes coverage
#              and a CycloneDX SBOM of the runtime dependencies.
#   precommit  every pre-commit hook (hygiene, ruff, bandit, detect-secrets).
#   container  builds the production image, smoke-tests it under the same
#              hardening as the Compose stack, and scans it with Trivy.
#
# Supply chain:
# - `permissions: contents: read` everywhere; no job can write to the repo.
# - Every third-party action is pinned to a full commit SHA (version in the
#   trailing comment; Dependabot keeps them current). Tags are mutable — in
#   March 2026 the trivy-action tags were force-pushed to malicious commits.
# - Dependencies install from the hash-verified lockfile (`uv sync --frozen`).

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (frozen, hash-verified)
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Ruff — lint
        run: uv run ruff check --output-format=github .

      - name: Ruff — format check
        run: uv run ruff format --check .

      - name: Mypy — strict types
        run: uv run mypy

      - name: Bandit — security lint
        run: uv run bandit -r src/ -c pyproject.toml

      - name: pip-audit — known-vulnerable dependencies
        run: |
          # `--quiet` silences the resolver status line that newer `uv` prints
          # to stdout; without it the file gets a leading non-requirement line
          # that pip-audit's strict mode rejects.
          uv export --quiet --format requirements-txt --no-emit-project \
            --no-hashes -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --strict

      - name: Pytest — coverage (floor in pyproject.toml)
        run: |
          uv run pytest \
            --cov=src/sentinel \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml

      - name: SBOM — runtime dependencies (CycloneDX)
        if: matrix.python-version == '3.12'
        run: |
          uv export --quiet --format requirements-txt --no-emit-project --no-dev \
            --no-hashes -o requirements-runtime.txt
          uv run pip-audit -r requirements-runtime.txt --strict \
            --format cyclonedx-json -o sbom.cdx.json

      - name: Upload coverage and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14

  precommit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Run pre-commit (all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  container:
    name: container image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker build -f deploy/docker/Dockerfile -t sentinel-linux:ci .

      - name: Smoke test (read-only, no capabilities, host under /host)
        run: scripts/smoke_test_image.sh sentinel-linux:ci

      - name: Trivy — fixable HIGH/CRITICAL vulnerabilities fail the build
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinel-linux:ci
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

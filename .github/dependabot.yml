# Keep dependencies, actions and base images current. Every update arrives as
# a PR that must pass the full CI gate (tests, pip-audit, Trivy) to merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly

  # The Compose stack's PostgreSQL, Prometheus and Grafana images.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly

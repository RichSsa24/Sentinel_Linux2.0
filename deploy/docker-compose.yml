# Sentinel-Linux 2.0 — full stack: Sentinel + PostgreSQL + Prometheus + Grafana.
#
#   install -m 600 deploy/.env.example deploy/.env   # owner-only; then set the secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Secrets are mandatory: Compose refuses to start (`:?`) rather than falling
# back to a well-known default key. Published ports bind to 127.0.0.1 only;
# put a TLS-terminating reverse proxy in front to expose them.

name: sentinel

# Third-party images are pinned by tag and digest (Dependabot's
# docker-compose ecosystem keeps both current; the scheduled scan workflow
# checks them for known vulnerabilities).

# Bounded container logs: json-file grows without limit by default.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  networks: [sentinel-net]
  logging: *logging

services:
  sentinel:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    image: sentinel-linux:local
    container_name: sentinel
    # Group adm (gid 4 on Debian and Ubuntu) reads /var/log/auth.log
    # (root:adm 0640) — the log-reader group, and nothing more. Without it the
    # auth-log collector cannot open the file. RHEL keeps /var/log/secure
    # root-only: see docs/OPERATIONS.md.
    group_add: ["4"]
    # A runaway (or attacked) process is contained instead of starving the
    # host it protects. Measured idle: ~86 MiB and 5 tasks; the outage buffer
    # (SENTINEL_PERSIST_MAX_BUFFERED) and the queue are bounded.
    mem_limit: 512m
    pids_limit: 128
    # Drain the queue and flush buffered events before Docker sends SIGKILL.
    # Worst case (database hung): the write in flight and a final write, each
    # bounded by SENTINEL_PERSIST_WRITE_TIMEOUT_SECONDS (10 s), up to 10 s
    # draining alert notifications and 5 s closing the connection pool.
    stop_grace_period: 45s
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:?set SENTINEL_API_KEY in deploy/.env}
      # Its own least-privilege role (deploy/postgres/initdb): never the superuser.
      SENTINEL_DATABASE_URL: postgresql+asyncpg://sentinel:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}@postgres:5432/sentinel
      # The host is visible read-only under /host (see volumes); collectors
      # read beneath it and report host-native paths and the host's name.
      SENTINEL_HOST_ROOT: /host
      # File integrity watches what is mounted below. User crontabs
      # (/var/spool/cron) are root-only on every distribution, so this
      # unprivileged container cannot watch them; /etc/crontab and /etc/cron.*
      # are covered. Add a path here only together with its mount.
      SENTINEL_FIM_PATHS: ${SENTINEL_FIM_PATHS:-/etc}
    # Optional tuning (webhook/email sinks, alert gates, retention ...). FIM
    # paths go in deploy/.env (with their mounts): `environment:` above wins.
    env_file:
      - path: sentinel.env
        required: false
    volumes:
      - /etc:/host/etc:ro
      - /var/log:/host/var/log:ro
      - /proc:/host/proc:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: sentinel_db
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    pids_limit: 256
    # The official entrypoint needs to chown/initdb as root before dropping to
    # the postgres user, so the capability set is trimmed rather than dropped.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      # The superuser is for administration (backups, upgrades) only; the
      # initdb script creates the `sentinel` role and database the app uses.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}
    volumes:
      - sentinel-db-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [sentinel-net]
    healthcheck:
      # Over TCP: while initdb runs, a temporary server answers on the unix
      # socket only, before the sentinel role and database exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: sentinel_prometheus
    mem_limit: 1g
    pids_limit: 128
    # One API key, two consumers: Sentinel checks it, Prometheus presents it.
    # Prometheus can only read a bearer token from a file, and Compose cannot
    # inject environment-sourced secrets into a read-only container, so the
    # token is written to a private tmpfs at start-up (0600, never on disk),
    # dropped from the environment, and the shell is replaced by Prometheus.
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:?set SENTINEL_API_KEY in deploy/.env}
    tmpfs:
      - /run/sentinel:mode=0700,uid=65534,gid=65534
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && printf %s "$$SENTINEL_API_KEY" > /run/sentinel/api_key
        && unset SENTINEL_API_KEY
        && exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - sentinel-prom-data:/prometheus
    depends_on: [sentinel]

  grafana:
    <<: *hardened
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: sentinel_grafana
    # Grafana 13 measured ~235 MiB and ~125 tasks (Go threads, plugins) once
    # the dashboard is in use: limits leave room for that, not for runaways.
    mem_limit: 512m
    pids_limit: 512
    tmpfs:
      - /tmp
      - /var/log/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Users, the changed admin password and saved dashboards survive restarts
      # (on a tmpfs they were lost with every container restart).
      - sentinel-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

networks:
  sentinel-net:
    driver: bridge

volumes:
  sentinel-db-data:
  sentinel-prom-data:
  sentinel-grafana-data:
